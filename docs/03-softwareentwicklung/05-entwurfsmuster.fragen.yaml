  frage: "Was sind Entwurfsmuster?"
  optionen:
    - "Fertige Bibliotheken zum Herunterladen"
    - "Bewährte Lösungsschablonen für wiederkehrende Entwurfsprobleme"
    - "Vorlagen für Benutzeroberflächen"
    - "Regeln für die Code-Formatierung"
  richtig: [1]
  erklaerung: "Muster beschreiben bewährte Strukturen und geben ihnen Namen – sie sind Lösung und gemeinsame Sprache zugleich."
