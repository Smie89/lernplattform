- id: se-em-008
  typ: single
  schwierigkeit: 3
  frage: "Warum ist das klassische Singleton für Tests problematisch?"
  optionen:
    - "Weil es zu langsam ist"
    - "Weil es globalen Zustand darstellt, den Tests gegenseitig verändern, und sich nicht durch ein Testdouble ersetzen lässt"
    - "Weil es nur in Java funktioniert"
    - "Weil es zu viele Instanzen erzeugt"
  richtig: [1]
  erklaerung: "Besser: eine normale Klasse, die der DI-Container als Singleton registriert – Tests können dann eine eigene Instanz übergeben."
  artikel: "#singleton"
  tags: [entwurfsmuster, singleton, flaky]

