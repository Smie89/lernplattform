# Fragenpool der Prüfungssimulation CTAL-TAE v2.0
#
# Eigene Fragen, keine offiziellen ISTQB-Fragen. Verteilung, K-Stufen und Punkte entsprechen den
# "Exam Structures & Rules"-Tabellen des ISTQB: 40 Fragen, 66 Punkte, bestanden ab 43, 90 Minuten.
#
# lernziele: id, k (2–4), anzahl (Fragen dieses Lernziels pro Prüfung), titel, artikel (Link zur Lektion)
# fragen:    id, lz (Lernziel), typ single | multiple (bei multiple genau so viele Treffer wählen, wie richtig sind),
#            frage, optionen, richtig (Indizes ab 0), erklaerung, optional artikel (überschreibt den des Lernziels)
# Punkte je Frage: K2 = 1, K3 = 2, K4 = 3. Geprüft mit "npm run pruefen".

name: "CTAL-TAE v2.0"
