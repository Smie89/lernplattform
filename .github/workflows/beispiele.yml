name: Beispielprojekte testen

on:
  push:
    branches: [main]
    paths: ['beispiele/**', '.github/workflows/beispiele.yml']
  pull_request:
    paths: ['beispiele/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shop-dotnet:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: beispiele/shop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build
      - name: Unit-Tests
        run: dotnet test tests/Shop.Core.Tests --no-build
      - name: API-Tests
        run: dotnet test tests/Shop.Api.Tests --no-build
      - name: Browser für UI-Tests installieren
        run: pwsh tests/Shop.UiTests/bin/Debug/net10.0/playwright.ps1 install --with-deps chromium
      - name: UI-Tests gegen die gestartete Anwendung
        run: ../linux/tests-mit-app.sh   # startet den Shop, wartet, testet, räumt auf

  shop-java:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: beispiele/shop-java
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Unit-Tests
        run: ./mvnw -B test
      - name: API- und UI-Tests
        run: ./mvnw -B verify

  linux-skripte:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: beispiele/linux
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: shellcheck *.sh
      - name: Selbsttest der Skripte
        run: ./selbsttest.sh

  entwicklung:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: C#-Beispiele (OOP, Muster, Refactoring, Sprachvergleich)
        run: dotnet test beispiele/entwicklung
      - name: Java-Sprachvergleich
        run: java beispiele/entwicklung-java/Sprachvergleich.java

  ki:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: beispiele/ki
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Auswertung (Metriken)
        run: python auswertung.py
      - name: Tests (Qualitätsschwellen, metamorphe Tests)
        run: python -m unittest -v
