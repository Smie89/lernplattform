name: Beispielprojekte testen

on:
  push:
    branches: [main]
    paths: ['beispiele/**', '.github/workflows/beispiele.yml']
  pull_request:
    paths: ['beispiele/**']
  workflow_dispatch:

permissions:
  contents: read

# Neuer Push auf denselben Branch bricht den noch laufenden Durchlauf ab – spart Zeit und Runner.
concurrency:
  group: beispiele-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shop-dotnet:
    runs-on: ubuntu-latest
    timeout-minutes: 20   # hängt etwas, bricht der Job ab, statt stundenlang Runner zu blockieren
    defaults:
      run:
        working-directory: beispiele/shop
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet build
      - name: Unit-Tests
        run: dotnet test tests/Shop.Core.Tests --no-build --logger trx --results-directory testergebnisse
      - name: API-Tests
        run: dotnet test tests/Shop.Api.Tests --no-build --logger trx --results-directory testergebnisse
      - name: Browser für UI-Tests installieren
        run: pwsh tests/Shop.UiTests/bin/Debug/net10.0/playwright.ps1 install --with-deps chromium
      - name: UI-Tests gegen die gestartete Anwendung
        run: ../linux/tests-mit-app.sh   # startet den Shop, wartet, testet, räumt auf
      - name: k6 installieren
        uses: grafana/setup-k6-action@v1
      - name: Rauchtest und kurzer Lasttest mit k6
        run: |
          ../linux/tests-mit-app.sh k6 run ../performance/lasttest.js
          ../linux/tests-mit-app.sh k6 run -e PROFIL=last ../performance/lasttest.js
      - name: Sicherheits-Header des laufenden Shops prüfen
        run: ../linux/tests-mit-app.sh python3 ../security/header_check.py http://localhost:5000/
      - name: Testergebnisse bei Fehlschlag sichern
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: testergebnisse-dotnet
          path: beispiele/shop/testergebnisse
          retention-days: 7

  shop-java:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: beispiele/shop-java
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Unit-Tests
        run: ./mvnw -B test
      - name: API- und UI-Tests
        run: ./mvnw -B verify

  linux-skripte:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: beispiele/linux
    steps:
      - uses: actions/checkout@v7
      - name: ShellCheck
        run: shellcheck *.sh
      - name: Selbsttest der Skripte
        run: ./selbsttest.sh

  entwicklung:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - name: C#-Beispiele (OOP, Muster, Refactoring, Sprachvergleich)
        run: dotnet test beispiele/entwicklung
      - name: Java-Sprachvergleich
        run: java beispiele/entwicklung-java/Sprachvergleich.java

  ki:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: beispiele/ki
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Auswertung (Metriken)
        run: python auswertung.py
      - name: Tests (Qualitätsschwellen, metamorphe Tests)
        run: python -m unittest -v

  security:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: beispiele/security
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Sicherheitstests (Angriffe gegen unsicher.py und sicher.py)
        run: python -m unittest -v
      - name: Erkennungsregel auf dem Beispiel-Log
        run: python log_analyse.py auth.log
      - name: Bandit installieren
        run: pip install bandit==1.9.4
      - name: "SAST: sicherer Code ohne Befunde"
        run: bandit sicher.py datenbank.py log_analyse.py header_check.py
      - name: "SAST-Grenzen: Bandit findet in unsicher.py genau 2 der 6 Lücken"
        run: |
          bandit -q -f json -o bandit.json unsicher.py || true
          python -c "import json; ids = sorted({r['test_id'] for r in json.load(open('bandit.json'))['results']}); print('Befunde:', ids); assert ids == ['B324', 'B608'], ids"

  datenbank:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: beispiele/datenbank
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: SQL-Tests (Abfragen, Constraints, Transaktionen, Indizes)
        run: python -m unittest -v

  netzwerk:
    # Matrix: dieselben Tests unter Linux und Windows – Windows meldet "Connection refused" erst nach ~2 s.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: beispiele/netzwerk
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Netzwerk-Tests (Subnetze, HTTP von Hand, TCP, UDP, DNS)
        run: python -m unittest -v

  cloud:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: beispiele/cloud
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Checkov installieren
        run: pip install checkov==3.4.11
      - name: "IaC-Scan: sichere Konfiguration ohne Befunde"
        run: checkov -d sicher --framework terraform --compact --quiet
      - name: "IaC-Scan: unsichere Konfiguration – erwartete Befunde und bekannte Lücke"
        run: |
          checkov -d unsicher --framework terraform -o json > checkov.json || true
          python pruefe_scan.py checkov.json

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: beispiele/python/requirements.txt
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Abhängigkeiten installieren
        working-directory: beispiele/python
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Unit-Tests (Fixtures, parametrize, Mocks, Hypothesis)
        working-directory: beispiele/python
        run: pytest tests/unit --junitxml=testergebnisse/unit.xml
      - name: Mini-Shop bauen
        working-directory: beispiele/shop
        run: dotnet build src/Shop.Web
      - name: API- und UI-Tests gegen den laufenden Shop
        working-directory: beispiele/shop
        run: ../linux/tests-mit-app.sh bash -c "cd ../python && SHOP_URL=http://localhost:5000 pytest -m 'api or ui' --junitxml=testergebnisse/e2e.xml --tracing retain-on-failure"
      - name: Testergebnisse und Playwright-Traces bei Fehlschlag sichern
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: testergebnisse-python
          path: |
            beispiele/python/testergebnisse
            beispiele/python/test-results
          retention-days: 7

  kubernetes:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: beispiele/kubernetes
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: pytest installieren
        run: pip install -r requirements.txt
      - name: "Manifeste prüfen: Checkov ohne Befunde (eigene Umgebung über pipx)"
        run: pipx run --spec checkov==3.4.11 checkov -d manifeste --framework kubernetes --compact --quiet
      - name: Container-Image des Mini-Shops bauen
        run: docker build -t mini-shop:1.0 -f Dockerfile ../shop
      - name: Kubernetes-Cluster mit kind starten
        uses: helm/kind-action@v1
        with:
          cluster_name: lernplattform
      - name: Image in den Cluster laden (ohne Registry)
        run: kind load docker-image mini-shop:1.0 --name lernplattform
      - name: Bereitstellen und warten, bis alle Pods bereit sind
        run: |
          kubectl apply -k manifeste
          kubectl -n mini-shop rollout status deployment/mini-shop --timeout=180s
      - name: Tests gegen den Cluster (Rauchtests, Selbstheilung, Zustand)
        run: pytest tests -v
      - name: Diagnose bei Fehlschlag
        if: failure()
        run: |
          kubectl -n mini-shop get all,endpointslices,events -o wide || true
          kubectl -n mini-shop describe pods || true
          kubectl -n mini-shop logs -l app=mini-shop --tail=50 --prefix || true

  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: beispiele/mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.10.2"
      - name: Unit-Tests der App (JVM, ohne Emulator) und APK bauen
        run: gradle --no-daemon testDebugUnitTest assembleDebug
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Appium und UiAutomator2-Treiber installieren
        run: |
          npm install -g appium@4.0.2
          appium driver install uiautomator2@10.4.0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Python-Client installieren
        run: pip install -r requirements.txt
      - name: Hardware-Beschleunigung (KVM) für den Emulator freischalten
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulator starten und Appium-Tests ausführen
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          working-directory: beispiele/mobile
          script: ./ci-tests.sh
      - name: Screenshots und Appium-Log bei Fehlschlag sichern
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: testergebnisse-mobile
          path: |
            beispiele/mobile/testergebnisse
            beispiele/mobile/appium.log
          retention-days: 7

  mutationstests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: "Stryker.NET: Shop.Core gegen Unit- und API-Tests (bricht unter 90 % ab)"
        working-directory: beispiele/shop
        run: |
          dotnet tool restore
          cd tests/Shop.Core.Tests
          dotnet stryker
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: "mutmut: Python-Logik gegen die Unit-Tests"
        working-directory: beispiele/python
        run: |
          pip install -r requirements.txt mutmut==3.8.1
          mutmut run
          # Jeden Überlebenden als Diff zeigen und dann abbrechen – jeder muss bewertet werden
          ueberlebende=$(mutmut results | awk -F: '/survived/ {print $1}')
          for m in $ueberlebende; do mutmut show "$m"; done
          test -z "$ueberlebende"
      - name: Berichte bei Fehlschlag sichern
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: mutationstests
          path: |
            beispiele/shop/tests/Shop.Core.Tests/StrykerOutput
            beispiele/python/mutants
          retention-days: 7

  observability:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: beispiele/observability
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: pytest installieren
        run: pip install -r requirements.txt
      - name: Container-Image des Mini-Shops bauen
        run: docker build -t mini-shop:1.0 -f ../kubernetes/Dockerfile ../shop
      - name: Stack starten (Shop, Jaeger, Prometheus, Grafana)
        run: docker compose up -d
      - name: Tests gegen den Stack (Metriken, Traces, Logs, Datenschutz, Grafana)
        run: pytest tests -v
      - name: Diagnose bei Fehlschlag
        if: failure()
        run: |
          docker compose ps
          docker compose logs --tail 80
      - name: Stack beenden
        if: always()
        run: docker compose down
