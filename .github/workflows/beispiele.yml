name: Beispielprojekte testen

on:
  push:
    branches: [main]
    paths: ['beispiele/**', '.github/workflows/beispiele.yml']
  pull_request:
    paths: ['beispiele/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shop-dotnet:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: beispiele/shop
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet build
      - name: Unit-Tests
        run: dotnet test tests/Shop.Core.Tests --no-build
      - name: API-Tests
        run: dotnet test tests/Shop.Api.Tests --no-build
      - name: Browser für UI-Tests installieren
        run: pwsh tests/Shop.UiTests/bin/Debug/net10.0/playwright.ps1 install --with-deps chromium
      - name: UI-Tests gegen die gestartete Anwendung
        run: ../linux/tests-mit-app.sh   # startet den Shop, wartet, testet, räumt auf
      - name: k6 installieren
        uses: grafana/setup-k6-action@v1
      - name: Rauchtest und kurzer Lasttest mit k6
        run: |
          ../linux/tests-mit-app.sh k6 run ../performance/lasttest.js
          ../linux/tests-mit-app.sh k6 run -e PROFIL=last ../performance/lasttest.js
      - name: Sicherheits-Header des laufenden Shops prüfen
        run: ../linux/tests-mit-app.sh python3 ../security/header_check.py http://localhost:5000/

  shop-java:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: beispiele/shop-java
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Unit-Tests
        run: ./mvnw -B test
      - name: API- und UI-Tests
        run: ./mvnw -B verify

  linux-skripte:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: beispiele/linux
    steps:
      - uses: actions/checkout@v7
      - name: ShellCheck
        run: shellcheck *.sh
      - name: Selbsttest der Skripte
        run: ./selbsttest.sh

  entwicklung:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - name: C#-Beispiele (OOP, Muster, Refactoring, Sprachvergleich)
        run: dotnet test beispiele/entwicklung
      - name: Java-Sprachvergleich
        run: java beispiele/entwicklung-java/Sprachvergleich.java

  ki:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: beispiele/ki
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Auswertung (Metriken)
        run: python auswertung.py
      - name: Tests (Qualitätsschwellen, metamorphe Tests)
        run: python -m unittest -v

  security:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: beispiele/security
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Sicherheitstests (Angriffe gegen unsicher.py und sicher.py)
        run: python -m unittest -v
      - name: Erkennungsregel auf dem Beispiel-Log
        run: python log_analyse.py auth.log
      - name: Bandit installieren
        run: pip install bandit==1.9.4
      - name: "SAST: sicherer Code ohne Befunde"
        run: bandit sicher.py datenbank.py log_analyse.py header_check.py
      - name: "SAST-Grenzen: Bandit findet in unsicher.py genau 2 der 6 Lücken"
        run: |
          bandit -q -f json -o bandit.json unsicher.py || true
          python -c "import json; ids = sorted({r['test_id'] for r in json.load(open('bandit.json'))['results']}); print('Befunde:', ids); assert ids == ['B324', 'B608'], ids"

  datenbank:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: beispiele/datenbank
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: SQL-Tests (Abfragen, Constraints, Transaktionen, Indizes)
        run: python -m unittest -v

  netzwerk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: beispiele/netzwerk
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Netzwerk-Tests (Subnetze, HTTP von Hand, TCP, UDP, DNS)
        run: python -m unittest -v

  cloud:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: beispiele/cloud
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Checkov installieren
        run: pip install checkov==3.4.11
      - name: "IaC-Scan: sichere Konfiguration ohne Befunde"
        run: checkov -d sicher --framework terraform --compact --quiet
      - name: "IaC-Scan: unsichere Konfiguration – erwartete Befunde und bekannte Lücke"
        run: |
          checkov -d unsicher --framework terraform -o json > checkov.json || true
          python pruefe_scan.py checkov.json
