[pytest]
testpaths = tests
addopts = -ra
filterwarnings =
    # Der Python-Client 6.5 markiert AppiumBy.ANDROID_UIAUTOMATOR als veraltet; der UiAutomator2-Treiber
    # unterstützt die Strategie weiterhin, und für UiScrollable gibt es auf Android keinen Ersatz.
    ignore:ANDROID_UIAUTOMATOR is deprecated:DeprecationWarning
